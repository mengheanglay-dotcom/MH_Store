<header class="site-header">
  <div class="announcement-bar">
    <span>Complimentary delivery on orders over $75</span>
    <a routerLink="/products"
      >Shop the edit <span aria-hidden="true">↗</span></a
    >
  </div>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a
        class="navbar-brand"
        routerLink="/"
        (click)="closeMenu()"
        aria-label="MH home"
      >
        <span class="brand-mark" aria-hidden="true"><span>MH</span></span>
        <span class="brand-name">Store</span>
      </a>

      <button
        class="menu-toggle"
        type="button"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen"
        aria-controls="mainNav"
        aria-label="Toggle navigation"
      >
        <span></span><span></span><span></span>
      </button>

      <div class="navbar-collapse" [class.is-open]="menuOpen" id="mainNav">
        <ul class="navbar-nav mx-auto gap-lg-2">
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{exact:true}"
              (click)="closeMenu()"
              >Home</a
            >
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/products"
              routerLinkActive="active"
              (click)="closeMenu()"
              >Shop <span class="nav-pill">New</span></a
            >
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/contact"
              routerLinkActive="active"
              (click)="closeMenu()"
              >Contact</a
            >
          </li>
        </ul>

        <div class="nav-actions">
          <a routerLink="/products" class="search-link" (click)="closeMenu()">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <span>Find a piece</span>
          </a>
          <a routerLink="/card" class="cart-button" (click)="closeMenu()">
            <span class="cart-icon" aria-hidden="true">▱</span>
            <span>Bag</span>
            <span class="cart-count"
              >{{ cardService.getCarditem().length }}</span
            >
          </a>
        </div>
      </div>
    </div>
  </nav>
</header>

<main><router-outlet /></main>
<app-footer></app-footer>
